<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tru Stream</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      }
      body {
        margin: 0;
        background: #111;
        color: #f5f5f5;
      }
      .layout {
        max-width: 1080px;
        margin: 0 auto;
        padding: 1rem;
        display: grid;
        gap: 1rem;
      }
      input {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid #333;
        border-radius: 8px;
        background: #1b1b1b;
        color: #fff;
      }
      #results {
        display: grid;
        gap: 0.75rem;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      }
      .card {
        border: 1px solid #2a2a2a;
        border-radius: 10px;
        overflow: hidden;
        cursor: pointer;
        background: #181818;
      }
      .card img {
        width: 100%;
        height: 240px;
        object-fit: cover;
      }
      .card .meta {
        padding: 0.6rem;
      }
      video {
        width: 100%;
        max-height: 70vh;
        background: #000;
        border-radius: 10px;
      }
      .status {
        color: #bcbcbc;
        font-size: 0.9rem;
        min-height: 1.2rem;
      }
    </style>
  </head>
  <body>
    <main class="layout">
      <input id="search" type="search" placeholder="Search movies..." autocomplete="off" />
      <div id="results"></div>
      <video id="player" controls playsinline preload="metadata"></video>
      <div id="status" class="status"></div>
    </main>

    <script>
      // Replace these placeholders before deployment. viewsCollectionId is optional.
      window.APPWRITE_CONFIG = {
        endpoint: 'https://cloud.appwrite.io/v1',
        projectId: 'YOUR_PROJECT_ID',
        databaseId: 'YOUR_DATABASE_ID',
        moviesCollectionId: 'Movies',
        issuesCollectionId: 'Issues',
        viewsCollectionId: ''
      };
    </script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
